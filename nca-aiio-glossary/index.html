{s:"Модели",t:"ML vs deep learning",e:"что внутри чего",ee:"what sits inside what",d:"Deep learning — подмножество машинного обучения: многослойные сети, большие данные, признаки модель выделяет сама. Обычный ML шире и включает методы попроще, которым много данных не нужно. Признак в вопросе — large datasets и complex neural networks.",de:"Deep learning is a subset of machine learning: many layers, large data, features the model extracts for itself. Ordinary ML is broader and includes simpler methods that need little data. The tell in a question is large datasets and complex neural networks."},
{s:"Модели",t:"curse of dimensionality",e:"проклятие размерности",ee:"curse of dimensionality",d:"Каждый лишний признак — ещё одно измерение. Данные растягиваются по огромному пространству, становятся разреженными, примеров на каждую комбинацию не хватает. Объясняет падение качества при добавлении ненужных признаков.",de:"Every extra feature is another dimension. Data spreads across a vast space, grows sparse, and there are not enough examples per combination. It explains why quality falls when useless features are added."},
{s:"Модели",t:"feature scaling",e:"приведение признаков к одному масштабу",ee:"bringing features to one scale",d:"Если один признак измеряется десятками, а другой миллионами, поправки к их весам различаются в тысячи раз, а шаг обучения общий. Масштабирование делает их сопоставимыми. Ответ в тестах — про стабильность градиентов, не про выбросы или переобучение.",de:"If one feature is measured in tens and another in millions, the corrections to their weights differ by thousands while the learning step is shared. Scaling makes them comparable. The exam answer is about gradient stability, not outliers or overfitting."},
{s:"Модели",t:"learning rate",e:"размер шага обучения",ee:"the size of the training step",d:"На него умножается градиент перед применением к весу. Один на все веса — отсюда и нужда в feature scaling. Слишком крупный шаг проскакивает минимум, слишком мелкий растягивает обучение.",de:"The gradient is multiplied by it before being applied to a weight. One value for every weight — which is why feature scaling is needed. Too large a step overshoots the minimum, too small drags training out."},
{s:"Модели",t:"vanishing gradient",e:"затухание градиента",ee:"vanishing gradient",d:"Сигнал ошибки, идущий назад по слоям или шагам, затухает и до ранних почти не доходит. Проблема глубины сети и длинных последовательностей — не количества признаков. Лечилась воротами в LSTM и GRU.",de:"The error signal travelling back through layers or steps fades and barely reaches the early ones. A problem of network depth and long sequences — not of feature count. Gates in LSTM and GRU were the fix."},
{s:"Модели",t:"backpropagation",e:"обратное распространение",ee:"backpropagation",d:"Ошибку прогоняют от выхода назад по слоям, определяя, какой вес насколько виноват. Вперёд — работа сети, назад — обучение.",de:"The error is pushed back from the output through the layers, working out how much each weight is to blame. Forward is the network working, backward is it learning."},
{s:"Модели",t:"тензор",te:"tensor",e:"многомерный массив чисел",ee:"a multi-dimensional array",d:"Скаляр, вектор, матрица и дальше. В модели тензоры — всё: входные данные, веса, промежуточные результаты. Обучение сводится к их перемножению, отсюда tensor cores.",de:"Scalar, vector, matrix and onward. In a model tensors are everything: inputs, weights, intermediate results. Training reduces to multiplying them, hence tensor cores."},
{s:"Модели",t:"data drift",e:"сдвиг распределения данных",ee:"shift in the data distribution",d:"Данные в проде со временем перестают походить на обучающие, и модель начинает ошибаться, хотя её не трогали. Нарушается предположение о стационарности. Лечится мониторингом, обнаружением дрейфа и переобучением.",de:"Production data stops resembling the training data over time and the model starts erring although nothing was changed. The stationarity assumption is violated. Addressed by monitoring, drift detection and retraining."},
{s:"Модели",t:"stationarity",e:"стационарность",ee:"stationarity",d:"Предположение, что статистические свойства данных не меняются со временем. На нём держится всё обучение: учим на прошлом, применяем к будущему. Соседние предположения — independence (наблюдения независимы), linearity (связь линейная), completeness (нет пропусков).",de:"The assumption that the statistical properties of the data do not change over time. All training rests on it: learn from the past, apply to the future. Neighbouring assumptions are independence (observations are unrelated), linearity (the relation is linear), completeness (no gaps)."},
{s:"Модели",t:"distributed training",e:"одна модель на многих GPU",ee:"one model across many GPUs",d:"Зонтичный термин для обучения на кластере. Три способа разделить работу комбинируются — это называют 3D parallelism.",de:"The umbrella term for training on a cluster. Three ways of splitting the work combine — that combination is called 3D parallelism."},
{s:"Модели",t:"data parallelism",e:"копия модели на каждой карте",ee:"a copy of the model on every card",d:"Данные разные, модель одна и та же. Градиенты объединяют через all-reduce. Самый частый вариант, работает пока модель помещается в одну карту.",de:"Different data, the same model. Gradients are merged through all-reduce. The commonest arrangement, valid while the model fits on one card."},
{s:"Модели",t:"model parallelism",e:"модель разрезана по картам",ee:"the model cut across cards",d:"Когда модель не влезает в одну GPU. Pipeline parallelism — режут по слоям, как конвейер. Tensor parallelism — режут внутри слоя, одну матрицу между картами; обмен так интенсивен, что делают только внутри сервера по NVLink.",de:"For when the model does not fit on one GPU. Pipeline parallelism cuts it by layer, like a conveyor. Tensor parallelism cuts inside a layer, one matrix across cards; the exchange is so intense that it is done only inside a server over NVLink."},
{s:"Модели",t:"KV cache",e:"кэш внимания при генерации",ee:"attention cache during generation",d:"Для каждого обработанного токена хранятся два вектора, чтобы не пересчитывать их на каждом шаге. Растёт от длины контекста и от числа одновременных запросов. Для 70B при 128K токенов — около 40 ГБ на один запрос, сопоставимо с весами. Веса при этом не растут: их размер задан числом параметров и форматом.",de:"Two vectors are kept for every token processed so they need not be recomputed at each step. It grows with context length and with the number of concurrent requests. For a 70B model at 128K tokens that is around 40 GB for a single request, comparable to the weights. The weights themselves do not grow: their size is fixed by parameter count and format."},
{s:"Модели",t:"p99 latency",e:"99-й перцентиль",ee:"99th percentile",d:"Время, в которое укладываются 99 запросов из ста. Смотрят на него, а не на среднее, потому что среднее прячет хвост. В AI-сервисах хвост раздувают батчинг, холодный старт и разная длина входа. У LLM рядом стоит time to first token.",de:"The time within which 99 requests out of a hundred complete. Watched instead of the average because the average hides the tail. In AI services the tail is stretched by batching, cold starts and varying input length. For LLMs, time to first token sits beside it."},
{s:"Модели",t:"training / inference",e:"две фазы",ee:"the two phases",d:"Training — модель создают, веса меняются, недели и месяцы, отказ узла останавливает прогон. Inference — готовая модель применяется, веса заморожены, запросы независимы. По объёму железа inference давно перевесил.",de:"Training — the model is built, weights change, weeks or months, and one failed node stops the run. Inference — a finished model is applied, weights frozen, requests independent. By hardware volume inference overtook training long ago."}
];

const SECT = {
  "Вычисления":"Compute",
  "Продукты":"Products",
  "Сеть":"Networking",
  "Хранилище":"Storage",
  "Инфраструктура":"Infrastructure",
  "Софт":"Software",
  "Модели":"Models"
};

const UI = {
  ru:{
    title:"NCA-AIIO — глоссарий", tagline:"нажми на карточку, чтобы перевернуть",
    search:"Поиск по термину или описанию", index:"указатель",
    fuzzy:"Точных совпадений нет — показано похожее.",
    progress:(a,b)=>a+" из "+b+" отмечено", reset:"сбросить",
    hint:"расшифровка на обороте",
    empty:"Ничего не нашлось. Попробуй другое слово или сними фильтр по разделу.",
    prev:"← назад", next:"вперёд →", know:"знаю", known:"выучено",
    random:"случайная", shuffle:"перемешать", nothing:"Ничего не нашлось.",
    keys:'<kbd>пробел</kbd> перевернуть, <kbd>←</kbd> <kbd>→</kbd> листать, <kbd>k</kbd> отметить как выученное, <kbd>r</kbd> случайная. В поиске <kbd>Enter</kbd> открывает указатель, <kbd>Esc</kbd> сбрасывает.',
    other:"EN", lang:"ru"
  },
  en:{
    title:"NCA-AIIO glossary", tagline:"click a card to flip it",
    search:"Search terms and descriptions", index:"index",
    fuzzy:"No exact match — showing close results.",
    progress:(a,b)=>a+" of "+b+" marked", reset:"reset",
    hint:"definition on the back",
    empty:"Nothing found. Try another word or clear the section filter.",
    prev:"← back", next:"next →", know:"know it", known:"learned",
    random:"random", shuffle:"shuffle", nothing:"Nothing found.",
    keys:'<kbd>space</kbd> flip, <kbd>←</kbd> <kbd>→</kbd> browse, <kbd>k</kbd> mark as learned, <kbd>r</kbd> random. In search, <kbd>Enter</kbd> opens the index and <kbd>Esc</kbd> clears it.',
    other:"RU", lang:"en"
  }
};

const SECTIONS = [...new Set(DATA.map(c => c.s))];
const KEY = "nca-aiio-known-v1";
const LKEY = "nca-aiio-lang";

let lang = "ru";
try { const s = localStorage.getItem(LKEY); if (s === "en" || s === "ru") lang = s; } catch (e) {}

let known = new Set();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) known = new Set(JSON.parse(raw));
} catch (e) { /* хранилище недоступно — работаем без отметок */ }

function save(){
  try { localStorage.setItem(KEY, JSON.stringify([...known])); } catch (e) {}
}

const T = () => UI[lang];
const sect = c => lang === "ru" ? c.s : (SECT[c.s] || c.s);
const term = c => lang === "ru" ? c.t : (c.te || c.t);
const expand = c => lang === "ru" ? c.e : (c.ee || c.e);
const descr = c => lang === "ru" ? c.d : (c.de || c.d);

let active = new Set(SECTIONS);
let deck = [];
let idx = 0;
let flipped = false;
let query = "";
let fuzzy = false;

const el = id => document.getElementById(id);
const cardEl = el("card"), emptyEl = el("empty");

function haystack(c){
  return [c.t, c.te, c.e, c.ee, c.d, c.de].filter(Boolean).join(" ").toLowerCase();
}

function exact(c){ return haystack(c).includes(query.toLowerCase()); }

// расстояние Дамерау — Левенштейна, с перестановкой соседних букв
function near(a, b){
  if (Math.abs(a.length - b.length) > 2) return 99;
  const m = [];
  for (let i = 0; i <= a.length; i++) m[i] = [i];
  for (let j = 0; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++){
    for (let j = 1; j <= b.length; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + cost);
      if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
        m[i][j] = Math.min(m[i][j], m[i-2][j-2] + 1);
      }
    }
  }
  return m[a.length][b.length];
}

function approx(c){
  const q = query.toLowerCase();
  const limit = q.length <= 4 ? 1 : 2;
  const names = [c.t, c.te, c.e, c.ee].filter(Boolean);
  if (names.some(n => near(n.toLowerCase(), q) <= limit)) return true;
  return names.join(" ").toLowerCase().split(/[\s/,—-]+/)
    .some(w => w.length > 2 && near(w, q) <= limit);
}

// чем ближе совпадение к названию термина, тем выше карточка
function rank(c){
  const q = query.toLowerCase();
  const names = [c.t, c.te].filter(Boolean).map(s => s.toLowerCase());
  if (names.some(n => n === q)) return 0;
  if (names.some(n => n.split(/[\s/,()—-]+/).some(w => w.startsWith(q)))) return 1;
  if (names.some(n => n.includes(q))) return 2;
  if ([c.e, c.ee].filter(Boolean).some(s => s.toLowerCase().includes(q))) return 3;
  return 4;
}

function matches(c){
  if (!active.has(c.s)) return false;
  if (!query) return true;
  return fuzzy ? approx(c) : exact(c);
}

function rebuild(){
  fuzzy = false;
  deck = DATA.filter(matches);
  if (query && !deck.length){
    fuzzy = true;
    deck = DATA.filter(matches);
  }
  if (query && !fuzzy) deck.sort((a, b) => rank(a) - rank(b));
  idx = 0;
  flipped = false;
  render();
  if (!el("index").hidden) buildIndex();
}

function shuffle(){
  for (let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0; flipped = false; render();
}

function randomCard(){
  if (deck.length < 2) return;
  let pool = deck.map((c, i) => i).filter(i => !known.has(deck[i].t) && i !== idx);
  if (!pool.length) pool = deck.map((c, i) => i).filter(i => i !== idx);
  idx = pool[Math.floor(Math.random() * pool.length)];
  flipped = false;
  render();
}

function paintUI(){
  const t = T();
  document.documentElement.lang = t.lang;
  document.title = t.title;
  el("h1").textContent = t.title;
  el("tagline").textContent = t.tagline;
  el("lang").textContent = t.other;
  el("search").placeholder = t.search;
  el("search").setAttribute("aria-label", t.search);
  el("toggleIndex").textContent = t.index;
  el("fuzzyNote").textContent = t.fuzzy;
  el("reset").textContent = t.reset;
  el("hint").textContent = t.hint;
  emptyEl.textContent = t.empty;
  el("prev").textContent = t.prev;
  el("next").textContent = t.next;
  el("random").textContent = t.random;
  el("shuffle").textContent = t.shuffle;
  el("keys").innerHTML = t.keys;
  [...el("filters").children].forEach((b, i) => {
    b.textContent = lang === "ru" ? SECTIONS[i] : (SECT[SECTIONS[i]] || SECTIONS[i]);
  });
}

function buildFilters(){
  const box = el("filters");
  SECTIONS.forEach(s => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", "true");
    b.addEventListener("click", () => {
      if (active.has(s)) { if (active.size > 1) active.delete(s); else return; }
      else active.add(s);
      b.setAttribute("aria-pressed", active.has(s) ? "true" : "false");
      rebuild();
    });
    box.appendChild(b);
  });
}

function render(){
  const t = T();
  el("fuzzyNote").hidden = !(fuzzy && deck.length);
  const inScope = DATA.filter(c => active.has(c.s));
  const done = inScope.filter(c => known.has(c.t)).length;
  el("progress").textContent = t.progress(done, inScope.length);
  el("barfill").style.width = inScope.length ? (done / inScope.length * 100) + "%" : "0%";

  if (!deck.length){
    cardEl.hidden = true; emptyEl.hidden = false;
    el("count").textContent = "";
    return;
  }
  cardEl.hidden = false; emptyEl.hidden = true;

  const c = deck[idx];
  el("sect").textContent = sect(c);
  el("term").textContent = term(c);
  el("backterm").textContent = term(c);
  el("expand").textContent = expand(c);
  el("body").textContent = descr(c);
  el("count").textContent = (idx + 1) + " / " + deck.length;
  el("know").classList.toggle("on", known.has(c.t));
  el("know").textContent = known.has(c.t) ? t.known : t.know;

  cardEl.classList.toggle("flipped", flipped);
}

function step(n){
  if (!deck.length) return;
  idx = (idx + n + deck.length) % deck.length;
  flipped = false;
  render();
}

function toggleKnown(){
  if (!deck.length) return;
  const k = deck[idx].t;
  if (known.has(k)) known.delete(k); else known.add(k);
  save(); render();
}

function collate(a, b){
  return term(a).localeCompare(term(b), lang === "ru" ? "ru" : "en", {sensitivity:"base", numeric:true});
}

function buildIndex(){
  const box = el("index");
  box.textContent = "";
  const ranked = !!query && !fuzzy;
  const items = DATA.filter(matches).slice()
    .sort(ranked ? (a, b) => rank(a) - rank(b) || collate(a, b) : collate);

  if (!items.length){
    const p = document.createElement("p");
    p.className = "tag";
    p.textContent = T().nothing;
    box.appendChild(p);
    return;
  }

  let letter = null, list = null;
  if (ranked){
    list = document.createElement("ul");
    list.className = "flat";
    box.appendChild(list);
  }
  items.forEach(c => {
    const first = term(c)[0].toUpperCase();
    if (!ranked && first !== letter){
      letter = first;
      const h = document.createElement("h2");
      h.textContent = letter;
      box.appendChild(h);
      list = document.createElement("ul");
      box.appendChild(list);
    }
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = term(c);
    if (known.has(c.t)) b.classList.add("done");
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "  " + sect(c);
    b.appendChild(tag);
    b.addEventListener("click", () => {
      const pos = deck.findIndex(x => x.t === c.t);
      if (pos >= 0){ idx = pos; flipped = true; render(); }
      showIndex(false);
      document.querySelector(".stage").scrollIntoView({block:"start", behavior:"smooth"});
    });
    li.appendChild(b);
    list.appendChild(li);
  });
}

function showIndex(on){
  el("index").hidden = !on;
  document.querySelector(".stage").hidden = on;
  document.querySelector(".controls").hidden = on;
  el("toggleIndex").setAttribute("aria-pressed", on ? "true" : "false");
  el("toggleIndex").classList.toggle("on", on);
  if (on) buildIndex();
}

function setLang(next){
  lang = next;
  try { localStorage.setItem(LKEY, lang); } catch (e) {}
  paintUI();
  render();
  if (!el("index").hidden) buildIndex();
}

el("lang").addEventListener("click", () => setLang(lang === "ru" ? "en" : "ru"));
el("toggleIndex").addEventListener("click", () => showIndex(el("index").hidden));

el("search").addEventListener("input", e => {
  query = e.target.value.trim();
  rebuild();
});

cardEl.addEventListener("click", () => { flipped = !flipped; render(); });
el("next").addEventListener("click", () => step(1));
el("prev").addEventListener("click", () => step(-1));
el("know").addEventListener("click", toggleKnown);
el("random").addEventListener("click", randomCard);
el("shuffle").addEventListener("click", shuffle);
el("reset").addEventListener("click", () => {
  known.clear(); save(); render();
  if (!el("index").hidden) buildIndex();
});

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")){
    if (e.key === "Escape"){ t.value = ""; query = ""; rebuild(); showIndex(false); t.blur(); }
    else if (e.key === "Enter"){
      e.preventDefault();
      if (deck.length === 1){ idx = 0; flipped = true; render(); showIndex(false); }
      else if (deck.length){ showIndex(true); }
      t.blur();
    }
    return;
  }
  if (!el("index").hidden) return;
  if (t && t.closest("button") && e.key === " ") return;
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  else if (e.key === " ") { flipped = !flipped; render(); e.preventDefault(); }
  else if (e.key === "k" || e.key === "K" || e.key === "л" || e.key === "Л") { toggleKnown(); }
  else if (e.key === "r" || e.key === "R" || e.key === "к" || e.key === "К") { randomCard(); }
});

buildFilters();
paintUI();
rebuild();
showIndex(true);
</script>
</body>
</html>
